<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Smart Petroleum Reporting System - Inspection and reporting platform for PBPA" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https:;
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    
    <!-- Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Additional Security Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Smart Reporting System</title>
  </head>
  <body>
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f3f4f6;">
        <div style="text-align: center; padding: 20px;">
          <h1 style="color: #374151; margin-bottom: 10px;">JavaScript Required</h1>
          <p style="color: #6b7280;">This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
