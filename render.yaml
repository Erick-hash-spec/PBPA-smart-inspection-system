databases:
  - name: pbpa-smart-inspection-system-db
    plan: free

services:
  - type: web
    name: pbpa-smart-inspection-system
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_HOST
        value: pbpa-smart-inspection-system-3dr7.onrender.com
      - key: BACKEND_HOST
        value: pbpa-smart-inspection-system.onrender.com
      - key: FRONTEND_URL
        value: https://pbpa-smart-inspection-system-3dr7.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://pbpa-smart-inspection-system-3dr7.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pbpa-smart-inspection-system-3dr7.onrender.com,https://pbpa-smart-inspection-system.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@your-domain.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_FIRST_NAME
        value: System
      - key: ADMIN_LAST_NAME
        value: Admin
      - key: ADMIN_DEPARTMENT
        value: Management
      - key: DATABASE_URL
        fromDatabase:
          name: pbpa-smart-inspection-system-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: true

  - type: web
    name: pbpa-smart-inspection-system-3dr7
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && REACT_APP_API_URL=https://pbpa-smart-inspection-system.onrender.com/api npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://pbpa-smart-inspection-system.onrender.com/api
