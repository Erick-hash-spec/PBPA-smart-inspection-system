databases:
  - name: smart-reporting-db
    plan: free

services:
  - type: web
    name: smart-reporting-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_HOST
        fromService:
          name: smart-reporting-frontend
          type: web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: smart-reporting-db
          property: connectionString

  - type: web
    name: smart-reporting-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && REACT_APP_API_URL=https://$API_HOST/api npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          name: smart-reporting-api
          type: web
          property: host
